<body><div class="app">
<div class="panel">
<h1>🎂 वाढदिवस शुभेच्छा पत्र तयार करा</h1>
<div class="note">या आवृत्तीत लेटरहेडमध्ये “प्रति” आणि “दिनांक” छापलेले नाहीत. त्यामुळे दोन्ही स्वतंत्र जागेत येतात आणि ओव्हरराइट होत नाहीत.</div>
<div class="row">
<div><label>प्रति — नाव</label><input id="name" value="डॉ. नरेंद्र काळे" placeholder="उदा. डॉ. सुशीलकुमार डेंगळे"></div>
<div><label>दिनांक</label><input id="date" type="date"></div>
</div>
<label>पद / परिचय (ऐच्छिक)</label><input id="designation" placeholder="उदा. माजी नगरसेवक">
<label>विषय</label><input id="subject" value="आपणांस वाढदिवसाच्या मनःपूर्वक शुभेच्छा!">
<label>पत्राचा मजकूर</label>
<textarea id="message">आपली मेहनत, प्रामाणिकपणा, माणसांशी जपलेले आत्मीय नाते आणि प्रत्येक कामात असलेली तळमळ कौतुकास्पद आहे. समाजातील प्रत्येक घटकासाठी सकारात्मक विचार ठेवून आपण करत असलेले कार्य निश्चितच प्रेरणादायी आहे. आपल्या प्रत्येक प्रयत्नाला यश मिळत राहो आणि आयुष्यात नवनवीन उंची गाठत राहो, ही ईश्वरचरणी प्रार्थना.

आपणास वाढदिवसानिमित्त उत्तम आरोग्य, दीर्घायुष्य, सुख-समृद्धी आणि आयुष्यात अखंड यश लाभो, ही सदिच्छा आणि पुन्हा एकदा वाढदिवसाच्या मनःपूर्वक शुभेच्छा!</textarea>
<label>आपला स्नेहांकित — नाव</label><input id="sign" value="डॉ. नरेंद्र काळे">
<button class="primary" onclick="window.print()">📄 PDF / Print तयार करा</button>
<button class="secondary" onclick="location.reload()">↺ पूर्ववत</button>
<div class="note">iPhone वर PDF साठी बटन दाबा → Print स्क्रीनवर पेजवर दोन बोटांनी zoom-in करा → Share → Save to Files.</div>
</div>
<div class="paper">
<div class="header"></div>
<div class="content">
<div class="date" id="pdate"></div>
<div class="to"><b>प्रति,</b><br><span id="pname"></span><br><span id="pdesignation"></span></div>
<div class="subject" id="psubject"></div>
<div class="message" id="pmessage"></div>
<div class="signature">आपला स्नेहांकित,<br><br><span id="psign"></span></div>
</div><div class="footer"></div></div>
</div>
<script>
const ids=["name","date","designation","subject","message","sign"];
function update(){
document.getElementById("pname").textContent=document.getElementById("name").value;
document.getElementById("pdesignation").textContent=document.getElementById("designation").value;
document.getElementById("psubject").textContent=document.getElementById("subject").value;
document.getElementById("pmessage").textContent=document.getElementById("message").value;
document.getElementById("psign").textContent=document.getElementById("sign").value;
let d=document.getElementById("date").value;
document.getElementById("pdate").textContent=d?new Date(d+"T00:00:00").toLocaleDateString("mr-IN"):"";
}
ids.forEach(x=>document.getElementById(x).addEventListener("input",update));update();
</script></body></html>
