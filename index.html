<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f47a20">
<title>वाढदिवस शुभेच्छा पत्र</title>
<style>
@font-face{font-family:Deva;src:local("Noto Serif Devanagari"),local("Noto Sans Devanagari");}
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#222;font-family:Deva,"Noto Serif Devanagari",serif}
header{background:white;padding:15px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0002}
h1{margin:0;font-size:21px}.sub{color:#666;font-size:12px;margin-top:3px}
main{max-width:900px;margin:auto;padding:14px}
.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
label{font-weight:bold;font-size:14px;display:block;margin-bottom:5px}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;font:16px Deva}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:9px;padding:11px 14px;font:700 15px Deva;cursor:pointer}
.primary{background:#f47a20;color:white}.green{background:#e7f5ed;color:#12663f}.red{background:#ffecec;color:#a00}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.note{font-size:12px;color:#666;line-height:1.55}
.list{display:flex;flex-direction:column;gap:8px}
.person{border:1px solid #ddd;border-radius:10px;padding:9px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.person b{font-size:15px}.small{font-size:12px;color:#666}
.preview{background:#ddd;border-radius:10px;padding:8px;overflow:auto}
.sheet{position:relative;width:min(100%,707px);aspect-ratio:1284/1816;background:#fff;margin:auto}
.sheet img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ov{position:absolute;color:#111;white-space:nowrap;font-weight:700}
.name{left:11.7%;top:20.0%;font-size:2.4%}
.desig{left:11.7%;top:22.7%;font-size:2.1%;font-weight:400}
.date{left:81.0%;top:14.0%;font-size:2.25%}
.hidden{display:none}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
@media print{
 header,.controls,.people{display:none!important}
 body{background:#fff}
 main{padding:0;max-width:none}
 .card{box-shadow:none;margin:0;padding:0}
 .preview{padding:0;background:white;overflow:visible}
 .sheet{width:210mm;height:297mm;aspect-ratio:auto;page-break-after:always}
 .sheet:last-child{page-break-after:auto}
}
</style>
</head>
<body>
<header>
<h1>🎂 वाढदिवस शुभेच्छा पत्र</h1>
<div class="sub">डॉ. नरेंद्र काळे यांच्या मूळ लेटरहेडवर</div>
</header>
<main>
<section class="card controls">
<div class="grid">
<div><label>नाव *</label><input id="name" placeholder="उदा. डॉ.संदीप चव्हाण सर"></div>
<div><label>पद / ओळख</label><input id="desig" placeholder="उदा. नेत्ररोग तज्ज्ञ"></div>
</div>
<div class="grid" style="margin-top:10px">
<div><label>दिनांक</label><input id="date" type="date"></div>
<div class="actions" style="align-items:end">
<button class="green" onclick="today()">आजची तारीख</button>
<button class="primary" onclick="add()">+ नाव जोडा</button>
</div>
</div>
<div class="actions">
<button class="primary" onclick="makePDF()">📄 सर्वांची PDF</button>
<button class="green" onclick="makeJPG()">🖼️ सध्याचे JPG</button>
<button class="red" onclick="clearAll()">सर्व नावे साफ</button>
</div>
<p class="note"><b>iPhone:</b> “सर्वांची PDF” दाबा → Print स्क्रीन उघडल्यावर preview वर दोन बोटांनी zoom करा → Share → Save to Files. प्रत्येक व्यक्तीचे स्वतंत्र पान असेल.</p>
</section>

<section class="card people">
<label>जोडलेली नावे</label>
<div id="people" class="list"><div class="small">अजून नाव जोडलेले नाही.</div></div>
</section>

<section class="card">

function isoToday(){
 const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fmt(v){if(!v)return "";let [y,m,d]=v.split("-");return d+"/"+m+"/"+y}
function today(){document.getElementById("date").value=isoToday(); preview()}
function preview(){
 document.getElementById("pvName").textContent=document.getElementById("name").value.trim();
 document.getElementById("pvDesig").textContent=document.getElementById("desig").value.trim();
 document.getElementById("pvDate").textContent=fmt(document.getElementById("date").value||isoToday());
}
function add(){
 let n=document.getElementById("name").value.trim();
 let d=document.getElementById("desig").value.trim();
 let dt=document.getElementById("date").value||isoToday();
 if(!n){alert("कृपया नाव लिहा.");return}
 names.push({n,d,dt}); render();
 document.getElementById("name").value="";
 document.getElementById("desig").value="";
 preview();
}
function render(){
 let el=document.getElementById("people");
 if(!names.length){el.innerHTML='<div class="small">अजून नाव जोडलेले नाही.</div>';return}
 el.innerHTML=names.map((x,i)=>`<div class="person"><div><b>${esc(x.n)}</b>${x.d?'<br><span class="small">'+esc(x.d)+'</span>':''}<br><span class="small">${fmt(x.dt)}</span></div><button class="red" onclick="removeOne(${i})">काढा</button></div>`).join("");
}
function removeOne(i){names.splice(i,1);render()}
function clearAll(){if(confirm("सर्व नावे काढायची आहेत का?")){names.length=0;render()}}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}

function makePDF(){
 if(!names.length){alert("किमान एक नाव जोडा.");return}
 const old=document.body.innerHTML;
 const pages=names.map(x=>`<div class="sheet">
 <img src="${imgSrc}">
 <div class="ov name">${esc(x.n)}</div>
 <div class="ov desig">${esc(x.d)}</div>
 <div class="ov date">${fmt(x.dt)}</div>
 </div>`).join("");
 document.body.innerHTML=`<main><div class="card"><div class="preview">${pages}</div></div></main>`;
 setTimeout(()=>{window.print();setTimeout(()=>location.reload(),700)},150);
}
